t_parking_auto:
  ros__parameters:
    use_sim_time: false
    target_slot: "auto"
    auto_start: true
    execute: true
    return_to_entrance: true
    stop_when_all_wheels_inside: true
    exit_mode: "forward_right"
    exit_planner_id: "ForwardExit"
    # Fixed return target for this base map. This is deliberately independent
    # from the localization/parking initial pose captured at START.
    exit_goal:
      x: 9.70
      y: 0.0
      yaw: 0.0
      position_tolerance: 0.05
      yaw_tolerance: 0.05
    require_forward_only_exit: true
    require_right_turn_exit: true
    max_reverse_distance_during_exit: 0.01
    freeze_slam_during_execution: false

    # Canonical real-vehicle start and the saved-map east-to-west approach.
    # The live map->base_link pose remains Nav2's actual planning start;
    # these values define the expected start and deterministic waypoints.
    opposite_start_x: 9.70
    opposite_start_y: 0.0
    opposite_start_yaw: 3.14159265359
    opposite_staging_lead: 0.50
    opposite_setup_inset_candidates: [0.45, 0.30, 0.15, 0.0]

    # Axis-aligned bounds measured directly in real_parking_map.yaml's map
    # frame.  Despite the legacy odom_x/odom_y key names, these values must
    # never be transformed through map->odom again.
    slot_1:
      odom_x: 5.10
      odom_y: -4.975
      yaw: 1.57079632679
      min_x: 3.25
      max_x: 6.95
      min_y: -8.70
      max_y: -1.25
    slot_2:
      odom_x: 7.415
      odom_y: 4.875
      yaw: -1.57079632679
      min_x: 6.50
      max_x: 8.33
      min_y: 2.16
      max_y: 7.59

    road_center_y: 0.0
    road_min_y: -2.16
    road_max_y: 2.16
    approach_lead: 0.50
    # Setup is measured beyond the slot's far side. Candidate geometry is
    # validated against the measured 1.82 m planning radius and full swept
    # footprint; pulling a full vehicle length past the slot still forces an
    # infeasible swing back.
    setup_offset_candidates: [0.60, 0.75, 0.90, 1.05]
    # Minimum gap between the vehicle footprint and the slot's side walls
    # anywhere inside the bay, checked over the whole entry path rather than
    # only at the final pose.
    wall_clearance: 0.08
    entry_depth_candidates: [0.10, 0.20, 0.30]

    vehicle_length: 1.33
    vehicle_width: 0.78
    vehicle_center_x_offset: 0.020
    costmap_footprint_padding: 0.025
    footprint_clearance: 0.06
    # Legacy depth value retained for before/after diagnostics only.
    rear_clearance: 0.70
    # Exact slot-end-wall to rear-bumper clearance. For slot_1 this is
    # (7.45 m slot depth - 1.33 m vehicle length) / 2 = 3.06 m, so the
    # physical vehicle envelope is centred along the bay instead of being
    # pushed against the back curb. It is checked again at PARKED.
    parking_end_clearance_m: 3.06
    # The planned endpoint is the safe target itself; no arbitrary path
    # overshoot or post-plan trimming is used.
    final_pose_overshoot: 0.0
    # Exact wheel links and geometry from turtle_car.urdf.xacro. TF is the
    # primary source; these values are the fallback if wheel TF is unavailable.
    wheel_frames:
      - "front_left_wheel_link"
      - "front_right_wheel_link"
      - "rear_left_wheel_link"
      - "rear_right_wheel_link"
    wheel_radius: 0.135
    wheel_base: 0.73
    front_wheel_track: 0.775
    rear_wheel_track: 0.785
    mechanical_steering_max_deg: 22.0
    maximum_command_steering_deg: 22.0
    wheel_inside_margin: 0.01
    wheel_inside_confirm_count: 5
    wheel_check_period: 0.10
    stop_confirm_count: 3
    # 0.730 / tan(22 deg) = 1.8068 m; match Nav2's rounded-up setting.
    minimum_turning_radius: 1.82
    curvature_tolerance_factor: 1.00
    minimum_reverse_length: 0.30
    # Reject overlapping multi-switch paths that RPP can oscillate across.
    maximum_cusps: 2
    occupied_threshold: 50

    system_wait_timeout: 120.0
    map_wait_timeout: 120.0
    scan_timeout: 2.0
    # Slot state remains UNKNOWN until both sectors of the single 360-degree
    # scan and both Nav2 costmaps provide a fresh multi-frame window.
    obstacle_observation_frames: 10
    costmap_observation_updates: 3
    obstacle_observation_settle_time: 1.0
    # Measured from the single lidar origin in its rear-facing +/-pi sector.
    rear_emergency_stop_distance: 0.15
    rear_emergency_sector_deg: 30.0

    # Common road-centre observation pose used only by execute=true when the
    # fresh SLAM map still has unknown cells behind the entrance curb.
    observation_odom_x: 6.50
    observation_odom_y: 0.0
    observation_odom_yaw: 0.0
    map_observation_settle_time: 3.0
    action_timeout: 45.0
    follow_path_timeout: 180.0
    parking_cancel_timeout: 5.0
    # Let Nav2 stop first; publish a zero safety pulse only if still moving.
    parking_stop_grace_timeout: 2.0

    # Capture the real map->base_link pose before the first motion. This is
    # the actual parking start only; the exit target is exit_goal above.
    entrance_pose_sample_count: 5
    entrance_pose_sample_interval: 0.10
    entrance_pose_capture_timeout: 10.0
    # The live AMCL correction settled to zero measurable 1 Hz motion over an
    # 11.17 s observation.  Require five continuous seconds inside the
    # existing 0.03 m / 0.05 rad noise bounds before clearing the costmap.
    localization_stability_duration: 5.0
    entrance_pose_position_stability: 0.03
    entrance_pose_yaw_stability: 0.05
    # The exact initial footprint begins as unknown under the stationary car.
    # Move to this known-free staging point, then let lidar clear the map.
    entrance_staging_distance: 1.0
    entrance_remap_timeout: 15.0
    maximum_exit_cusps: 4
    # Safety margins subtracted from the latest legal turn start.
    # The rear tyres cannot fully leave the mouth on a straight and still fit
    # the quarter turn; the complete swept footprint and slot-wall clearance
    # are checked instead.  Larger margins begin the turn earlier and increase
    # its radius; right_turn_lead then samples a modest later turn entry.
    forward_clear_distance_candidates: [0.02, 0.07, 0.12, 0.17]
    right_turn_lead_candidates: [0.00, 0.05, 0.10]
    lane_merge_distance_candidates: [0.80]
    # Smac plan-only testing showed discretization can tighten a nominal arc;
    # generate at 2.30 m while validating every sampled path at >=1.82 m.
    exit_planning_turn_radius: 2.30
    final_position_tolerance: 0.08
    final_yaw_tolerance: 0.12
    # Strict odometry settling allowance after Nav2 reports goal.
    stop_wait_timeout: 120.0

    planner_id: "GridBased"
    controller_id: "ParkingFollowPath"
    forward_controller_id: "ParkingForward"
    reverse_controller_id: "ParkingReverse"
    goal_checker_id: "parking_goal_checker"
    progress_checker_id: "progress_checker"
