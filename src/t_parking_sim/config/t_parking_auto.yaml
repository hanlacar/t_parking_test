t_parking_auto:
  ros__parameters:
    use_sim_time: true
    target_slot: "auto"
    auto_start: false
    execute: false
    return_to_entrance: true
    stop_when_all_wheels_inside: true
    exit_mode: "forward_right"
    exit_planner_id: "ForwardExit"
    require_forward_only_exit: true
    require_right_turn_exit: true
    max_reverse_distance_during_exit: 0.01
    freeze_slam_during_execution: true

    # SDF world positions transformed into the initial odom frame.  The
    # initial world pose is (-5, 0, yaw=0), so odom_x = world_x + 5.
    slot_1:
      odom_x: 5.75
      odom_y: 4.25
      yaw: -1.57079632679
      min_x: 5.00
      max_x: 6.50
      min_y: 1.75
      max_y: 6.75
    slot_2:
      odom_x: 7.25
      odom_y: 4.25
      yaw: -1.57079632679
      min_x: 6.50
      max_x: 8.00
      min_y: 1.75
      max_y: 6.75

    road_center_y: 0.0
    road_min_y: -1.75
    road_max_y: 1.75
    approach_lead: 0.50
    # How far past the far edge of the slot the vehicle pulls up before
    # reversing in.  Everything below one vehicle length (0.90 m) forces a
    # reverse arc too sharp to clear the slot's side wall, so the old
    # [0.40, 0.55, 0.70] range could only ever be driven by clipping the
    # entrance corner.  The minimum is now the vehicle length itself.
    setup_offset_candidates: [0.90, 1.15, 1.40, 1.65]
    # Minimum gap between the vehicle footprint and the slot's side walls
    # anywhere inside the bay, checked over the whole entry path rather than
    # only at the final pose.
    wall_clearance: 0.08
    entry_depth_candidates: [0.10, 0.20, 0.30]

    vehicle_length: 0.90
    vehicle_width: 0.45
    footprint_clearance: 0.06
    # Clearance from the rear bumper to the back curb used only when
    # computing how deep the final parking pose may go.  Must be larger
    # than footprint_clearance: global_costmap's inflation_radius (0.55m,
    # nav2_params.yaml) makes the planner's footprint check -- and the
    # RegulatedPurePursuitController's live local-costmap collision
    # check during FollowPath -- fail near the curb well before the raw
    # footprint would actually touch it.  0.70 was picked empirically
    # against the live global/local costmap so both GridBased planning
    # and FollowPath execution stay clear of the inflation gradient.
    rear_clearance: 0.70
    # How much deeper the FollowPath waypoint targets than rear_clearance.
    # Keeps the literal path endpoint past the wheel-inside monitor's own
    # trigger point, so the monitor's confirmation dwell always finishes
    # (and cancels the path) before Nav2's own goal checker can declare
    # the goal reached on its own -- which this node treats as a failure,
    # since the stop would not have been verified by the wheel check.
    final_pose_overshoot: 0.10
    # Exact wheel links and geometry from turtle_car.urdf.xacro.  TF is the
    # primary source; wheel_base/track are only used if wheel TF is unavailable.
    wheel_frames:
      - "front_left_wheel_link"
      - "front_right_wheel_link"
      - "rear_left_wheel_link"
      - "rear_right_wheel_link"
    wheel_radius: 0.095
    wheel_base: 0.58
    wheel_track: 0.38
    wheel_inside_margin: 0.01
    wheel_inside_confirm_count: 5
    wheel_check_period: 0.10
    stop_confirm_count: 3
    minimum_turning_radius: 0.946
    curvature_tolerance_factor: 1.20
    minimum_reverse_length: 0.30
    # Reject overlapping multi-switch paths that RPP can oscillate across.
    maximum_cusps: 2
    occupied_threshold: 50

    system_wait_timeout: 120.0
    map_wait_timeout: 120.0
    scan_timeout: 2.0
    # Measured from the rear sensor face, centred on its rear-facing zero ray.
    rear_emergency_stop_distance: 0.15
    rear_emergency_sector_deg: 30.0

    # Common road-centre observation pose used only by execute=true when the
    # fresh SLAM map still has unknown cells behind the entrance curb.
    observation_odom_x: 6.50
    observation_odom_y: 0.0
    observation_odom_yaw: 0.0
    map_observation_settle_time: 3.0
    action_timeout: 45.0
    follow_path_timeout: 180.0
    parking_cancel_timeout: 5.0
    # Let Nav2 stop first; publish a zero safety pulse only if still moving.
    parking_stop_grace_timeout: 2.0

    # Capture the real map->base_footprint pose before the first motion and use
    # it as the final entrance-return target.
    entrance_pose_sample_count: 5
    entrance_pose_sample_interval: 0.10
    entrance_pose_capture_timeout: 10.0
    entrance_pose_position_stability: 0.03
    entrance_pose_yaw_stability: 0.05
    # The exact initial footprint begins as unknown under the stationary car.
    # Return to this known-free staging point, then let lidar clear the goal.
    entrance_staging_distance: 1.0
    entrance_remap_timeout: 15.0
    entrance_return_position_tolerance: 0.10
    entrance_return_yaw_tolerance: 0.12
    maximum_exit_cusps: 4
    forward_clear_distance_candidates: [0.45, 0.55, 0.65, 0.75]
    right_turn_lead_candidates: [0.15, 0.25, 0.35]
    lane_merge_distance_candidates: [0.80, 1.00, 1.20]
    final_position_tolerance: 0.08
    final_yaw_tolerance: 0.12
    # Strict odometry settling allowance after Nav2 reports goal.
    stop_wait_timeout: 120.0

    planner_id: "GridBased"
    controller_id: "ParkingFollowPath"
    goal_checker_id: "parking_goal_checker"
    progress_checker_id: "progress_checker"
