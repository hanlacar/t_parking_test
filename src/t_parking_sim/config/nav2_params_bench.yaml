# BENCH ONLY: saved-map geometry with no live lidar obstacle projection.
# This file is an overlay on nav2_params.yaml; production remains unchanged.
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /bench/odom
    # BENCH virtual feedback integrates commands and is not a parking
    # accuracy measurement. Keep production's cusp checker unchanged while
    # accepting the observed 0.1453 rad virtual yaw residual at the seam.
    cusp_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.16
    # BENCH-only cusp/final capture. This equals the configured maximum
    # lookahead and covers roughly the last five poses of the observed path.
    # The controller's production default remains disabled (0.0 m).
    ParkingForward:
      terminal_capture_distance: 0.35
    ParkingReverse:
      terminal_capture_distance: 0.35

planner_server:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    odom_topic: /bench/odom

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: bench_base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.685, 0.39], [0.685, -0.39], [-0.645, -0.39], [-0.645, 0.39]]"
      footprint_padding: 0.025
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        enabled: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: bench_base_link
      resolution: 0.05
      footprint: "[[0.685, 0.39], [0.685, -0.39], [-0.645, -0.39], [-0.645, 0.39]]"
      footprint_padding: 0.025
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        enabled: false
